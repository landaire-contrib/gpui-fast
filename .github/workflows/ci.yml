name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libasound2-dev libfontconfig-dev libfreetype-dev libssl-dev \
            libvulkan1 libwayland-dev libx11-xcb-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      # rust-toolchain.toml pins the toolchain; this installs it.
      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # The runner has no GPU, and wgpu finds no usable adapter with the WARP
      # its Windows image ships with. Install the WARP release wgpu's own CI uses
      # next to the test executables, which Direct3D 12 loads in its place
      # (after rust-cache, which restores target/).
      - name: Install WARP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -L --retry 5 -o warp.zip https://www.nuget.org/api/v2/package/Microsoft.Direct3D.WARP/1.0.20
          New-Item -ItemType Directory -Force target/warp, target/debug/deps | Out-Null
          tar -xf warp.zip -C target/warp build/native/bin/x64/d3d10warp.dll
          Copy-Item target/warp/build/native/bin/x64/d3d10warp.dll target/debug/
          Copy-Item target/warp/build/native/bin/x64/d3d10warp.dll target/debug/deps/
          Remove-Item -Recurse warp.zip, target/warp

      - name: Test gpui
        run: cargo test -p gpui --features test-support

      - name: Link GPUI Fast with GPUI Pre
        if: runner.os == 'Windows'
        run: cargo test -p gpui_perf --features fast,upstream --test windows_manifest_coexistence

      # Scroll layer tiles must match drawing directly, byte for byte, on
      # each renderer; these run on the runner's GPU, and fail rather than
      # skip when no adapter is found.
      - name: Test scroll layers on WGPU (Metal, DX12)
        if: runner.os == 'macOS' || runner.os == 'Windows'
        env:
          GPUI_REQUIRE_GPU: "1"
        run: cargo test -p gpui_wgpu --features test-support fast::layers -- --nocapture

      - name: Test dynamic textures on WGPU (Metal, DX12)
        if: runner.os == 'macOS' || runner.os == 'Windows'
        env:
          GPUI_REQUIRE_GPU: "1"
        run: cargo test -p gpui_wgpu --features test-support fast::dynamic_textures -- --nocapture

      # Dev-dependencies enable the test-support features gpui_macos needs.
      - name: Test the macOS platform on WGPU
        if: runner.os == 'macOS'
        run: cargo test -p gpui_macos

      - name: Test the Windows platform on WGPU
        if: runner.os == 'Windows'
        run: cargo test -p gpui_windows --features test-support

      - name: Check gpui_perf
        run: cargo check -p gpui_perf --all-targets

      # The gpui-pre stand-ins GPUI Kit applications patch in (compat/): every
      # feature a gpui-pre crate has must reach ours.
      - name: Check compat
        run: >-
          cargo check -p gpui-pre -p gpui-pre-platform -p gpui-pre-macros
          -p gpui-pre-reqwest-client -p gpui-pre-sum-tree --all-features

  lint:
    name: Lint and upstream check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # script/check-upstream compares with the upstream import commit.
          fetch-depth: 0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libasound2-dev libfontconfig-dev libfreetype-dev libssl-dev \
            libvulkan1 libwayland-dev libx11-xcb-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Check that upstream files only hold hooks
        run: script/check-upstream

      - name: Rustfmt
        run: cargo fmt -p gpui -p gpui_perf -- --check

      - name: Clippy
        run: cargo clippy -p gpui -p gpui_perf --all-targets --features gpui/test-support -- -D warnings
